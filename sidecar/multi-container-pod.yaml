apiVersion: v1
kind: Pod
metadata:
  name: two-node-containers
  labels:
    app: multi-container-demo
spec:
  containers:
    # Container 1: Web application
    - name: web-app
      image: multi-container-demo:1.0
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
      env:
        - name: PORT
          value: "3000"
        - name: APP_MESSAGE
          value: "Hello from the Web App"

    # Container 2: Sidecar application
    - name: sidecar
      image: multi-container-demo:1.0
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3001
      env:
        - name: PORT
          value: "3001"
        - name: APP_MESSAGE
          value: "Hello from the Sidecar"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-health
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app-health
  template:
    metadata:
      labels:
        app: node-app-health
    spec:
      containers:
        - name: node-app
          image: node-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
